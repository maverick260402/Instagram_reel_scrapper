<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Analytics Hub</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="auth-container">
    <div class="auth-card">
        <div class="auth-brand">
            <a href="/static/landing.html" class="auth-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Analytics Hub</span>
            </a>
        </div>

        <div class="form-tabs">
            <button class="form-tab active" data-tab="login">Login</button>
            <button class="form-tab" data-tab="signup">Sign Up</button>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label class="form-label" for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    class="form-input"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    class="form-input"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                Login
            </button>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" class="auth-form" style="display: none;">
            <div class="form-group">
                <label class="form-label" for="signupUsername">Username</label>
                <input
                    type="text"
                    id="signupUsername"
                    class="form-input"
                    placeholder="Choose a username"
                    required
                    minlength="3"
                    maxlength="100"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="signupEmail">Email</label>
                <input
                    type="email"
                    id="signupEmail"
                    class="form-input"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="signupPassword">Password</label>
                <input
                    type="password"
                    id="signupPassword"
                    class="form-input"
                    placeholder="Create a password"
                    required
                    minlength="8"
                >
                <div class="password-requirements">
                    Min. 8 characters with letters and numbers
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="signupPasswordConfirm">Confirm Password</label>
                <input
                    type="password"
                    id="signupPasswordConfirm"
                    class="form-input"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="signupBtn">
                Create Account
            </button>
        </form>
    </div>
    <script src="/static/auth.js?v=2"></script>
</body>
</html>
