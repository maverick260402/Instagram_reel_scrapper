name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Backend/requirements.txt

    - name: Wait for PostgreSQL
      run: |
        for i in {1..30}; do
          pg_isready -h localhost -p 5432 -U test_user && break
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

    - name: Set up test environment
      run: |
        cd Backend
        cat > .env << EOF
        DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db
        SECRET_KEY=test-secret-key-for-ci-only-not-for-production-use
        ALGORITHM=HS256
        ACCESS_TOKEN_EXPIRE_MINUTES=10080
        ENVIRONMENT=testing
        DEBUG=True
        ALLOWED_ORIGINS=http://localhost:8080
        MAX_REQUESTS_PER_MINUTE=60
        EOF

    - name: Run database migrations
      run: |
        cd Backend
        PGPASSWORD=test_password psql -h localhost -U test_user -d test_db -f migrations/000_initial_schema.sql
        PGPASSWORD=test_password psql -h localhost -U test_user -d test_db -f migrations/001_multi_user_system.sql
        PGPASSWORD=test_password psql -h localhost -U test_user -d test_db -f migrations/002_phase3_indexes_views.sql

    - name: Run Phase 1 Tests
      run: |
        cd Backend
        python test_phase1.py
      continue-on-error: false

    - name: Run Phase 2 Tests
      run: |
        cd Backend
        python test_phase2.py
      continue-on-error: false

    - name: Run Phase 3 Tests
      run: |
        cd Backend
        python test_phase3.py
      continue-on-error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          Backend/*.log
          Backend/test-results/
        retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to VPS
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_PORT: ${{ secrets.VPS_PORT }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      run: |
        ssh -i ~/.ssh/deploy_key -p ${VPS_PORT:-22} ${VPS_USER}@${VPS_HOST} << 'ENDSSH'
          set -e

          echo "===================================="
          echo "Starting deployment..."
          echo "===================================="

          # Navigate to application directory
          cd /opt/instagram-scraper

          # Pull latest code
          echo "Pulling latest code from GitHub..."
          git pull origin main

          # Activate virtual environment
          echo "Activating virtual environment..."
          source venv/bin/activate

          # Install/update dependencies
          echo "Installing dependencies..."
          pip install --upgrade pip
          pip install -r Backend/requirements.txt

          # Run database migrations
          echo "Running database migrations..."
          cd /opt/instagram-scraper/deployment
          ./run-migrations.sh

          # Restart systemd service
          echo "Restarting application service..."
          sudo systemctl restart instagram-scraper

          # Wait for service to start
          echo "Waiting for service to start..."
          sleep 10

          # Health check
          echo "Performing health check..."
          if curl -f http://localhost:8080/docs > /dev/null 2>&1; then
            echo "✓ Health check passed!"
          else
            echo "✗ Health check failed!"
            sudo systemctl status instagram-scraper
            exit 1
          fi

          echo "===================================="
          echo "Deployment completed successfully!"
          echo "===================================="
        ENDSSH

    - name: Cleanup SSH
      if: always()
      run: |
        rm -f ~/.ssh/deploy_key

    - name: Deployment notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✓ Deployment to VPS completed successfully"
        else
          echo "✗ Deployment to VPS failed"
          exit 1
        fi
