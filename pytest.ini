[pytest]
testpaths = Backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=Backend
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-branch

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
