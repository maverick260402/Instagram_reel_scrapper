services:
  postgres:
    image: postgres:15-alpine
    container_name: instagram_scraper_db

    environment:
      POSTGRES_USER: scraper_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: instagram_scraper
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "127.0.0.1:5432:5432"   # ✅ no conflict

    volumes:
      - postgres_data:/var/lib/postgresql/data

      # AUTO INIT
      - ./Backend/migrations/000_base_schema.sql:/docker-entrypoint-initdb.d/000_base_schema.sql
      - ./Backend/migrations/000_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
      - ./Backend/migrations/001_multi_user_system.sql:/docker-entrypoint-initdb.d/002_multi_user_system.sql
      - ./Backend/migrations/002_phase3_indexes_views.sql:/docker-entrypoint-initdb.d/003_phase3.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper_user -d instagram_scraper"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data:
