version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: instagram_scraper_db
    environment:
      POSTGRES_USER: scraper_user
      POSTGRES_PASSWORD: scraper_password_123
      POSTGRES_DB: instagram_scraper
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper_user -d instagram_scraper"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - scraper_network

  # Optional: pgAdmin for database management
  # Uncomment the section below to enable pgAdmin
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: instagram_scraper_pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - postgres
  #   networks:
  #     - scraper_network
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  scraper_network:
    driver: bridge