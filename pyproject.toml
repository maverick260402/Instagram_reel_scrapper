[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-reel-scraper"
version = "3.1.0"
description = "Instagram Reel Scraper with Multi-User Support"
requires-python = ">=3.8"

[tool.pytest.ini_options]
testpaths = ["Backend"]
python_files = ["test_*.py"]
addopts = ["--cov=Backend", "--cov-report=xml"]

[tool.coverage.run]
source = ["Backend"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/migrations/*"
]

[tool.coverage.report]
precision = 2
show_missing = true
